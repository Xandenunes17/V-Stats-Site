<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V-Stats ✦ Global</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root { 
    --green: #B9FF66; --black: #191A23; --white: #FFFFFF; --gray: #F3F3F3; 
    --border: 2px solid #191A23; --shadow: 6px 6px 0px #191A23; --text: #191A23; --star-off: #ccc;
}
body.dark-mode { 
    --white: #191A23; --black: #B9FF66; --gray: #292A33; --text: #FFFFFF; 
    --border: 2px solid #B9FF66; --shadow: 6px 6px 0px #B9FF66; --star-off: #555;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background 0.3s, color 0.3s; }
body { background: var(--white); color: var(--text); overflow-x: hidden; padding-bottom: 100px; }

nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: var(--border); background: var(--white); position: sticky; top: 0; z-index: 1000; }
.logo { font-weight: 900; font-size: 22px; }

.main-container { width: 95%; max-width: 450px; margin: 20px auto; display: flex; flex-direction: column; gap: 20px; }
.player-card { border: var(--border); border-radius: 25px; background: var(--white); box-shadow: var(--shadow); overflow: hidden; width: 100%; }
.card-header { display: flex; border-bottom: var(--border); flex-wrap: wrap; background: var(--white); }

.card-left { width: 32%; background: var(--gray); border-right: var(--border); padding: 15px 5px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.card-right { width: 68%; padding: 15px; position: relative; }
.overall-val { font-size: 60px; font-weight: 900; line-height: 1; margin-bottom: -5px; }

.badges-wrapper { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.img-slot { max-height: 50px; max-width: 55px; object-fit: contain; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1)); }
.flag-slot { width: 45px; height: auto; border-radius: 4px; border: 1px solid rgba(0,0,0,0.15); }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
.stat-box { background: var(--black); color: var(--white); padding: 10px; border-radius: 12px; text-align: center; }
.stat-name { font-size: 9px; color: var(--green); font-weight: bold; display: block; text-transform: uppercase; }
.stat-num { font-size: 20px; font-weight: 900; }

.stars-container { display: flex; justify-content: center; gap: 3px; margin-top: 5px; }
.star-btn { cursor: pointer; font-size: 16px; color: var(--star-off); }
.star-btn.active { color: var(--green); }

.athlete-item { border: var(--border); padding: 15px; border-radius: 15px; background: var(--gray); margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 4px 4px 0px var(--black); }
.search-ovr { background: var(--black); color: var(--green); padding: 5px 10px; border-radius: 8px; font-weight: 900; font-size: 18px; border: 1px solid var(--green); display: flex; flex-direction: column; align-items: center; justify-content: center; }

input, select { width: 100%; padding: 12px; margin: 5px 0; border: var(--border); border-radius: 10px; background: var(--white); color: var(--text); font-size: 15px; }
.btn { background: var(--black); color: var(--white); border: var(--border); padding: 12px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; text-align: center; }

.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; display: flex; background: var(--white); border: var(--border); border-bottom: none; border-radius: 20px 20px 0 0; padding: 10px 0; z-index: 1000; }
.nav-item { flex: 1; text-align: center; font-size: 11px; font-weight: bold; cursor: pointer; }

.hidden { display: none !important; }
@media (max-width: 400px) { .card-left, .card-right { width: 100%; border-right: none; } .card-left { border-bottom: var(--border); } }
</style>
</head>
<body>

<nav>
    <div class="logo">V-STATS ✦</div>
    <button onclick="toggleDarkMode()" style="background:none; border:none; font-size:22px; cursor:pointer;">🌓</button>
</nav>

<div class="main-container">
    <div id="auth-screen" class="auth-card" style="padding: 25px;">
        <h2 id="auth-title">Entrar</h2>
        <input type="text" id="auth-nick" placeholder="Apelido">
        <input type="password" id="auth-pass" placeholder="Senha">
        <div id="register-fields" class="hidden">
            <input type="email" id="reg-email" placeholder="E-mail (opcional)">
            <select id="reg-pos-init">
                <option value="Levantador">Levantador</option>
                <option value="Oposto">Oposto</option>
                <option value="Ponteiro">Ponteiro</option>
                <option value="Central">Central</option>
                <option value="Líbero">Líbero</option>
            </select>
        </div>
        <button class="btn" style="margin-top:15px" onclick="handleAuth()">Confirmar</button>
        <p onclick="toggleAuthMode()" style="text-align:center; margin-top:15px; cursor:pointer; text-decoration:underline; font-size:12px;">Não tem conta? Registe-se</p>
    </div>

    <div id="main-app" class="hidden">
        
        <div id="page-ranking" class="app-page hidden">
            <h2 style="margin-bottom:15px">🏆 Ranking Global</h2>
            <div style="display:flex; gap:5px; margin-bottom:15px;">
                <select id="rank-stat" onchange="renderRanking()">
                    <option value="OVR">Média (OVR)</option>
                    <option value="ATA">Ataque</option>
                    <option value="LEV">Levantamento</option>
                    <option value="BLO">Bloqueio</option>
                    <option value="DEF">Defesa</option>
                    <option value="PAS">Passe</option>
                    <option value="SAQ">Saque</option>
                </select>
                <select id="rank-pos" onchange="renderRanking()">
                    <option value="Todos">Todas as Posições</option>
                    <option value="Levantador">Levantador</option>
                    <option value="Oposto">Oposto</option>
                    <option value="Ponteiro">Ponteiro</option>
                    <option value="Central">Central</option>
                    <option value="Líbero">Líbero</option>
                </select>
            </div>
            <div id="ranking-list"></div>
        </div>

        <div id="page-search" class="app-page">
            <h2 style="margin-bottom:15px">🔍 Atletas</h2>
            <input type="text" id="search-input" placeholder="Procurar atleta..." oninput="renderSearch()">
            <div id="athlete-list"></div>
        </div>

        <div id="page-profile" class="app-page hidden">
            <button class="btn" id="btn-back" onclick="showPage('search')" style="margin-bottom:15px; display:none; background:var(--gray); color:var(--text); width: auto;">← Voltar</button>
            
            <div class="player-card">
                <div class="card-header">
                    <div class="card-left">
                        <div class="overall-val" id="card-ovr">--</div>
                        <div id="card-pos" style="background:var(--green); color:#000; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:bold; text-transform:uppercase;">POS</div>
                        <div class="badges-wrapper">
                            <img id="display-team-logo" class="img-slot" src="">
                            <img id="display-city-flag" class="flag-slot" src="">
                        </div>
                    </div>
                    <div class="card-right">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <img id="card-photo" src="" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: var(--border); background: var(--gray);" onerror="this.src='https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png'">
                                <div>
                                    <h2 id="card-nick" style="font-size: 20px; line-height: 1;">NOME</h2>
                                    <p id="card-details" style="font-size:11px; opacity:0.7;">Cidade | Time</p>
                                </div>
                            </div>
                            <button id="btn-edit-trigger" onclick="toggleEditFields()" style="background:none; border:1px solid #ccc; border-radius:5px; padding:2px 5px; cursor:pointer;">⚙️</button>
                        </div>

                        <div id="edit-profile-area" class="hidden" style="margin-top:15px; background:var(--gray); padding:10px; border-radius:10px;">
                            <input type="text" id="update-photo" placeholder="URL da foto">
                            <select id="update-pos">
                                <option value="Levantador">Levantador</option>
                                <option value="Oposto">Oposto</option>
                                <option value="Ponteiro">Ponteiro</option>
                                <option value="Central">Central</option>
                                <option value="Líbero">Líbero</option>
                            </select>
                            <select id="update-team">
                                <option value="Livre">Livre</option>
                                <option value="União Vôlei">União Vôlei</option>
                                <option value="Vôlei Mar">Vôlei Mar</option>
                            </select>
                            <select id="update-city">
                                <option value="Brasil">Brasil</option>
                                <option value="Amargosa">Amargosa</option>
                                <option value="Salvador">Salvador</option>
                            </select>
                            <button class="btn" style="margin-top:5px; font-size:12px;" onclick="saveProfileUpdates()">Salvar Alterações</button>
                        </div>

                        <div style="height:130px; margin-top:10px;"><canvas id="radarChart"></canvas></div>
                    </div>
                </div>
                <div id="card-stats-grid" class="stats-grid"></div>
                <div style="padding:15px"><button class="btn" id="btn-logout" style="background:#ff4444" onclick="logout()">Sair da Conta</button></div>
            </div>
        </div>
    </div>
</div>

<div id="nav-bar" class="bottom-nav hidden">
    <div class="nav-item" onclick="showPage('profile')">👤<br>PERFIL</div>
    <div class="nav-item" onclick="showPage('ranking')">🏆<br>RANKING</div>
    <div class="nav-item" onclick="showPage('search')">🔍<br>BUSCA</div>
</div>

<script>
const SB_URL = 'https://bxjqvlmqhykzzgnypvsx.supabase.co'; 
const SB_KEY = 'sb_publishable_xTtFi8LsDmgHIxeez3OCdg_sIhEhG-y';
const _supabase = supabase.createClient(SB_URL, SB_KEY);
const GITHUB_BASE = "https://raw.githubusercontent.com/Xandenunes17/V-Stats-Site/main/vstats-assets";

const BIBLIOTECA_IMAGENS = {
    times: { "União Vôlei": `${GITHUB_BASE}/Logo-Uniao-Volei.png`, "Vôlei Mar": `${GITHUB_BASE}/Logo-Volei-Mar.png`, "Livre": `${GITHUB_BASE}/Logo-Livre.png` },
    cidades: { "Amargosa": `${GITHUB_BASE}/Amargosa-Bandeira.png`, "Salvador": `${GITHUB_BASE}/Salvador-Bandeira.png`, "Brasil": `${GITHUB_BASE}/Brasil-Bandeira.png` }
};

let currentUserData = null;
let viewedUserData = null;
let radarChart = null;
let isDarkMode = false;
let isRegisterMode = false;

window.onload = () => {
    const savedUser = localStorage.getItem('vstats_user');
    if (savedUser) { currentUserData = JSON.parse(savedUser); enterApp(); }
};

function toggleDarkMode() { isDarkMode = !isDarkMode; document.body.classList.toggle('dark-mode', isDarkMode); if(viewedUserData) displayCard(viewedUserData); }
function toggleAuthMode() { isRegisterMode = !isRegisterMode; document.getElementById('auth-title').innerText = isRegisterMode ? "Criar Conta" : "Entrar"; document.getElementById('register-fields').classList.toggle('hidden', !isRegisterMode); }
function toggleEditFields() { document.getElementById('edit-profile-area').classList.toggle('hidden'); }

async function handleAuth() {
    const nick = document.getElementById('auth-nick').value.trim().toLowerCase();
    const pass = document.getElementById('auth-pass').value.trim();
    if(!nick || !pass) return alert("Preencha o Apelido e a Senha!");

    if(isRegisterMode) {
        // Tentativa de registo com tratamento de erro detalhado
        const { data, error } = await _supabase.from('atletas').insert([{ 
            nick, pass, pos: document.getElementById('reg-pos-init').value, 
            city: "Brasil", team: "Livre", photo: "", stats: {ATA:60,LEV:60,BLO:60,DEF:60,PAS:60,SAQ:60}, ratings: {} 
        }]).select();
        
        if(error) {
            console.error("Erro de Registo:", error);
            return alert("Erro ao criar conta: " + (error.message.includes('photo') ? "A coluna 'photo' não existe no banco de dados. Execute o SQL no Supabase." : error.message));
        }
        currentUserData = data[0];
    } else {
        const { data, error } = await _supabase.from('atletas').select('*').eq('nick', nick).single();
        if(data && data.pass === pass) {
            currentUserData = data;
        } else {
            return alert("Apelido ou Senha incorretos!");
        }
    }
    localStorage.setItem('vstats_user', JSON.stringify(currentUserData));
    enterApp();
}

// --- FUNÇÃO DE AVALIAÇÃO (CORRIGIDA) ---
async function rateStat(statKey, stars) {
    if(!viewedUserData || viewedUserData.nick === currentUserData.nick) return;
    
    // 1. Buscar os ratings mais recentes do servidor para evitar conflitos
    const { data: current, error: fError } = await _supabase.from('atletas').select('ratings').eq('nick', viewedUserData.nick).single();
    if(fError) return alert("Erro ao contactar o servidor.");

    let ratings = current.ratings || {};
    if(!ratings[statKey]) ratings[statKey] = { total: 0, count: 0 };
    
    ratings[statKey].total += (stars * 20);
    ratings[statKey].count += 1;

    // 2. Atualizar no Supabase
    const { error: uError } = await _supabase.from('atletas').update({ ratings }).eq('nick', viewedUserData.nick);
    
    if(uError) {
        console.error("Erro ao avaliar:", uError);
        alert("Erro ao salvar avaliação. Verifique as permissões RLS no Supabase.");
    } else {
        // 3. Recarregar o cartão para mostrar a nova média
        const { data: updatedUser } = await _supabase.from('atletas').select('*').eq('nick', viewedUserData.nick).single();
        displayCard(updatedUser);
    }
}

function displayCard(u) {
    if(!u) return;
    viewedUserData = u;
    const isOwner = (u.nick === currentUserData.nick);
    
    document.getElementById('card-nick').innerText = u.nick;
    document.getElementById('card-pos').innerText = u.pos;
    document.getElementById('card-details').innerText = `${u.city} | ${u.team}`;
    document.getElementById('card-photo').src = u.photo || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';
    document.getElementById('display-team-logo').src = BIBLIOTECA_IMAGENS.times[u.team] || '';
    document.getElementById('display-city-flag').src = BIBLIOTECA_IMAGENS.cidades[u.city] || '';
    document.getElementById('btn-edit-trigger').style.display = isOwner ? 'block' : 'none';

    const grid = document.getElementById('card-stats-grid'); grid.innerHTML = '';
    let sum = 0; const keys = ['ATA','LEV','BLO','DEF','PAS','SAQ']; const vals = [];
    
    keys.forEach(k => {
        let baseVal = (u.stats && u.stats[k]) ? u.stats[k] : 60;
        let avgStars = 0;
        
        if(u.ratings && u.ratings[k] && u.ratings[k].count > 0) {
            const avgPoints = u.ratings[k].total / u.ratings[k].count;
            avgStars = Math.round(avgPoints / 20);
            baseVal = Math.round((baseVal + avgPoints) / 2);
        }
        
        sum += baseVal; vals.push(baseVal);
        
        let starsHtml = isOwner ? '' : '<div class="stars-container">';
        if(!isOwner) {
            for(let i=1; i<=5; i++) {
                starsHtml += `<span class="star-btn ${i <= avgStars ? 'active' : ''}" onclick="rateStat('${k}', ${i})">★</span>`;
            }
            starsHtml += '</div>';
        }
        
        grid.innerHTML += `<div class="stat-box"><span class="stat-name">${k}</span><span class="stat-num">${baseVal}</span>${starsHtml}</div>`;
    });
    
    document.getElementById('card-ovr').innerText = Math.round(sum/6);
    const chartColor = isDarkMode ? '#B9FF66' : '#191A23';
    setTimeout(() => initChart(vals, chartColor), 50);
}

async function renderSearch() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const { data } = await _supabase.from('atletas').select('*').ilike('nick', `%${q}%`);
    const list = document.getElementById('athlete-list'); list.innerHTML = '';
    data?.forEach(u => {
        let sum = 0; ['ATA','LEV','BLO','DEF','PAS','SAQ'].forEach(k => {
            let val = u.stats[k] || 60; 
            if(u.ratings?.[k]) val = (val + (u.ratings[k].total/u.ratings[k].count))/2;
            sum += val;
        });
        list.innerHTML += `<div class="athlete-item" onclick="loadOther('${u.nick}')"><div><strong>${u.nick}</strong><br><small>${u.pos}</small></div><div class="search-ovr">${Math.round(sum/6)}</div></div>`;
    });
}

async function renderRanking() {
    const stat = document.getElementById('rank-stat').value;
    const pos = document.getElementById('rank-pos').value;
    let query = _supabase.from('atletas').select('*');
    if(pos !== 'Todos') query = query.eq('pos', pos);
    const { data } = await query;
    if(!data) return;

    const list = data.map(u => {
        let sum = 0; const s = {}; ['ATA','LEV','BLO','DEF','PAS','SAQ'].forEach(k => {
            let val = u.stats[k] || 60; if(u.ratings?.[k]) val = Math.round((val + (u.ratings[k].total/u.ratings[k].count))/2);
            s[k] = val; sum += val;
        });
        s.OVR = Math.round(sum/6); return {...u, s};
    }).sort((a,b) => b.s[stat] - a.s[stat]);

    const listEl = document.getElementById('ranking-list'); listEl.innerHTML = '';
    list.forEach((u, i) => {
        let badge = i<3 ? ['🥇','🥈','🥉'][i] : `${i+1}º`;
        listEl.innerHTML += `<div class="athlete-item" onclick="loadOther('${u.nick}')"><div>${badge} <strong>${u.nick}</strong></div><div class="search-ovr" style="${stat!=='OVR'?'border-color:var(--text)':''}"><small style="font-size:8px">${stat}</small>${u.s[stat]}</div></div>`;
    });
}

function initChart(data, color) {
    const ctx = document.getElementById('radarChart').getContext('2d');
    if(radarChart) radarChart.destroy();
    radarChart = new Chart(ctx, {
        type: 'radar',
        data: { labels: ['ATA','LEV','BLO','DEF','PAS','SAQ'], datasets: [{ data, backgroundColor: 'rgba(185, 255, 102, 0.4)', borderColor: '#B9FF66', borderWidth: 2, pointRadius: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { r: { min: 0, max: 100, ticks: { display: false }, pointLabels: { color: color, font: { weight: 'bold', size: 10 } } } }, plugins: { legend: { display: false } } }
    });
}

async function saveProfileUpdates() {
    const update = { 
        team: document.getElementById('update-team').value, 
        city: document.getElementById('update-city').value, 
        pos: document.getElementById('update-pos').value, 
        photo: document.getElementById('update-photo').value 
    };
    const { error } = await _supabase.from('atletas').update(update).eq('nick', currentUserData.nick);
    if(error) {
        alert("Erro ao salvar: " + error.message);
    } else {
        currentUserData = {...currentUserData, ...update};
        localStorage.setItem('vstats_user', JSON.stringify(currentUserData));
        displayCard(currentUserData);
        toggleEditFields();
        alert("Perfil atualizado!");
    }
}

async function loadOther(nick) { 
    const { data } = await _supabase.from('atletas').select('*').eq('nick', nick).single();
    if(data) { 
        showPage('profile'); 
        displayCard(data); 
        document.getElementById('btn-back').style.display='block'; 
        document.getElementById('btn-logout').classList.add('hidden'); 
    } 
}

function showPage(p) {
    document.querySelectorAll('.app-page').forEach(el => el.classList.add('hidden'));
    document.getElementById('page-' + p).classList.remove('hidden');
    if(p === 'profile') { 
        displayCard(currentUserData); 
        document.getElementById('btn-back').style.display='none'; 
        document.getElementById('btn-logout').classList.remove('hidden'); 
    }
    else if(p === 'search') renderSearch(); 
    else if(p === 'ranking') renderRanking();
}

function enterApp() { 
    document.getElementById('auth-screen').classList.add('hidden'); 
    document.getElementById('main-app').classList.remove('hidden'); 
    document.getElementById('nav-bar').classList.remove('hidden'); 
    showPage('profile'); 
}

function logout() { localStorage.removeItem('vstats_user'); location.reload(); }
</script>
</body>
</html>
