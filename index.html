<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VS | V-Stats</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
:root { 
    --primary: #22C55E; 
    --bg-main: #0F1115; 
    --bg-panel: #1A1F26; 
    --bg-card: #2A2F36; 
    --text-light: #E5E7EB; 
    --white: #FFFFFF; 
    --star-off: #4B5563;
    --border-radius: 12px;
    --glow: 0 0 15px rgba(34, 197, 94, 0.3);
    --border-subtle: 1px solid rgba(229, 231, 235, 0.1);
}
.container {
  width: 100%;
  max-width: 1200px; /* ou 1400px se quiser mais largo */
  margin: 0 auto;
  padding: 0 20px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body { background: var(--bg-main); color: var(--text-light); overflow-x: hidden; padding-bottom: 100px; }

/* Tipografia Futurista para Títulos e Números */
h1, h2, h3, .logo-text, .overall-val, .stat-num, .search-ovr {
    font-family: 'Orbitron', sans-serif;
}

/* Navbar Topo */
nav { 
    display: flex; justify-content: center; align-items: center; 
    padding: 20px 5%; background: var(--bg-main); 
    border-bottom: 1px solid var(--bg-panel); position: sticky; top: 0; z-index: 1000; 
}
.logo-container { display: flex; align-items: center; gap: 10px; }
.logo-icon { display: flex; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 28px; font-style: italic; letter-spacing: -2px; }
.logo-v { color: var(--primary); text-shadow: 2px 2px 0px #000; }
.logo-s { color: var(--text-light); margin-left: -5px; text-shadow: 2px 2px 0px #000; }
.logo-text { font-weight: 700; font-size: 18px; color: var(--text-light); letter-spacing: 2px; }

.main-container { width: 95%; max-width: 500px; margin: 20px auto; display: flex; flex-direction: column; gap: 20px; }

/* Tela de Autenticação (Hero Section) */
.auth-card { padding: 30px 20px; text-align: left; }
.hero-title { font-size: 32px; line-height: 1.1; margin-bottom: 10px; text-transform: uppercase; color: var(--text-light); }
.hero-title span { color: var(--primary); }
.hero-subtitle { font-size: 14px; color: #9CA3AF; margin-bottom: 30px; }

/* Componentes de Input e Select */
input, select { 
    width: 100%; padding: 14px; margin: 8px 0; 
    border: 1px solid var(--bg-card); border-radius: 8px; 
    background: var(--bg-panel); color: var(--white); 
    font-size: 14px; outline: none; transition: border 0.3s, box-shadow 0.3s;
}
input:focus, select:focus { border-color: var(--primary); box-shadow: var(--glow); }

/* Botões Modernos */
.btn { 
    background: transparent; color: var(--primary); 
    border: 1px solid var(--primary); padding: 14px; 
    border-radius: 8px; cursor: pointer; font-weight: bold; 
    width: 100%; text-align: center; font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px; transition: all 0.3s; text-transform: uppercase;
}
.btn:hover { background: var(--primary); color: var(--bg-main); box-shadow: var(--glow); }
.btn-solid { background: var(--primary); color: var(--bg-main); border: none; }
.btn-solid:hover { background: #1ea34d; box-shadow: var(--glow); }
.btn-danger { color: #ef4444; border-color: #ef4444; }
.btn-danger:hover { background: #ef4444; color: var(--white); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

/* Cartão do Jogador (Dashboard Panel) */
.player-card { 
    background: var(--bg-panel); border: var(--border-subtle); 
    border-radius: var(--border-radius); box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    overflow: hidden; width: 100%; 
}
.card-header { display: flex; flex-wrap: wrap; border-bottom: var(--border-subtle); }

.card-left { 
    width: 35%; background: var(--bg-card); 
    padding: 20px 10px; text-align: center; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 15px;
    border-right: var(--border-subtle);
}
.card-right { width: 65%; padding: 20px; position: relative; }

.overall-wrapper {
    position: relative; width: 80px; height: 80px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 3px solid var(--primary);
    box-shadow: inset 0 0 10px rgba(34,197,94,0.2), 0 0 15px rgba(34,197,94,0.4);
}
.overall-val { font-size: 38px; font-weight: 900; color: var(--white); }

.badges-wrapper { display: flex; gap: 10px; justify-content: center; width: 100%; margin-top: 5px; }
.logo-main {
    height: 45px; 
    width: auto; 
    object-fit: contain; 
    max-width: 100%; 
}
.img-slot, .flag-slot {
    height: 40px;
    width: auto;
    object-fit: contain;}
.flag-slot { width: 35px; height: auto; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }

.profile-info { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
.profile-user { display: flex; gap: 12px; align-items: center; }
.profile-pic { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-card); }
#card-nick { font-size: 20px; color: var(--white); letter-spacing: 1px; text-transform: uppercase; }
#card-details { font-size: 11px; color: #9CA3AF; margin-top: 2px; }
.pos-badge { 
    background: var(--bg-card); color: var(--primary); 
    padding: 4px 8px; border-radius: 4px; font-size: 10px; 
    font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border: 1px solid rgba(34,197,94,0.3);
}

/* Grid de Estatísticas */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 20px; }
.stat-box { 
    background: var(--bg-main); padding: 12px 5px; 
    border-radius: 8px; text-align: center; border: 1px solid var(--bg-card);
    transition: transform 0.2s, box-shadow 0.2s;
}
.stat-box:hover { transform: translateY(-2px); border-color: rgba(34,197,94,0.5); box-shadow: var(--glow); }
.stat-name { font-size: 10px; color: var(--primary); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px; }
.stat-num { font-size: 22px; color: var(--white); }

/* Estrelas de Avaliação */
.stars-container { display: flex; justify-content: center; gap: 2px; margin-top: 6px; }
.star-btn { cursor: pointer; font-size: 14px; color: var(--star-off); transition: color 0.2s; }
.star-btn:hover, .star-btn.active { color: var(--primary); text-shadow: 0 0 5px var(--primary); }

/* Listas (Ranking e Busca) */
.filter-row { display: flex; gap: 10px; margin-bottom: 20px; }
.filter-row select { margin: 0; }

.athlete-item { 
    background: var(--bg-panel); border: var(--border-subtle); 
    padding: 15px; border-radius: 12px; margin-bottom: 12px; 
    cursor: pointer; display: flex; justify-content: space-between; 
    align-items: center; transition: all 0.3s;
}
.athlete-item:hover { border-color: var(--primary); transform: translateX(5px); background: var(--bg-card); }
.athlete-info { display: flex; align-items: center; gap: 15px; }
.athlete-info img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid var(--bg-main); }
.athlete-info h4 { font-family: 'Orbitron', sans-serif; color: var(--white); font-size: 16px; text-transform: uppercase; }
.athlete-info p { font-size: 11px; color: #9CA3AF; margin-top: 3px; }

.search-ovr { 
    background: var(--bg-main); color: var(--primary); 
    padding: 8px 12px; border-radius: 8px; font-size: 20px; 
    border: 1px solid var(--bg-card); display: flex; flex-direction: column; 
    align-items: center; justify-content: center; min-width: 60px;
}
.search-ovr small { font-size: 9px; color: #9CA3AF; font-family: 'Inter', sans-serif; margin-bottom: 2px; }

/* Menu Navegação Mobile */
.bottom-nav { 
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
    width: 100%; max-width: 500px; display: flex; 
    background: var(--bg-panel); border-top: var(--border-subtle); 
    padding: 15px 0; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
}
.nav-item { 
    flex: 1; text-align: center; font-size: 10px; font-weight: bold; 
    cursor: pointer; color: #9CA3AF; transition: color 0.3s;
    display: flex; flex-direction: column; gap: 5px; align-items: center;
}
.nav-item:hover, .nav-item.active { color: var(--primary); }
.nav-icon { font-size: 20px; }

.hidden { display: none !important; }

@media (max-width: 400px) { 
    .card-header { flex-direction: column; }
    .card-left, .card-right { width: 100%; border-right: none; } 
    .card-left { border-bottom: var(--border-subtle); flex-direction: row; justify-content: space-between; padding: 15px 20px; }
    .overall-wrapper {  width: clamp(60px, 18vw, 90px);
  aspect-ratio: 1 / 1; /* mantém quadrado perfeito */
  border-radius: 50%;
  border: 3px solid #22C55E;
  
  display: flex;
  align-items: center;
  justify-content: center;

  font-size: clamp(18px, 5vw, 28px);
  font-weight: bold;
  color: #E5E7EB;}
    .overall-val { font-size: 28px; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<nav>
    <img src="https://raw.githubusercontent.com/Xandenunes17/V-Stats-Site/main/vstats-assets/Logo-VStatus.png" 
         class="logo-main" 
         alt="V-STATS Logo">
</nav>

<div class="main-container">
    
    <div id="auth-screen" class="auth-card">
        <h1 class="hero-title">Analise.<br>Desempenho.<br><span>Evolução.</span></h1>
        <p class="hero-subtitle">Acompanhe estatísticas detalhadas, melhore seu desempenho e suba de nível.</p>
        
        <h2 id="auth-title" style="font-size: 16px; margin-bottom: 15px; color: var(--white); font-family: 'Inter', sans-serif;">Entrar no Sistema</h2>
        <input type="text" id="auth-nick" placeholder="Apelido de Jogador">
        <input type="password" id="auth-pass" placeholder="Senha">
        
        <div id="register-fields" class="hidden">
            <input type="email" id="reg-email" placeholder="E-mail (Opcional)">
            <select id="reg-pos-init">
                <option value="Levantador">Levantador</option>
                <option value="Oposto">Oposto</option>
                <option value="Ponteiro">Ponteiro</option>
                <option value="Central">Central</option>
                <option value="Líbero">Líbero</option>
            </select>
        </div>
        
        <button class="btn btn-solid" style="margin-top:20px" onclick="handleAuth()">Acessar Dashboard</button>
        <p onclick="toggleAuthMode()" style="text-align:center; margin-top:20px; cursor:pointer; font-size:13px; color: #9CA3AF; transition: color 0.3s;">
            Não tem cadastro? <span style="color: var(--primary); text-decoration: none; font-weight: bold;">Criar Conta</span>
        </p>
    </div>

    <div id="main-app" class="hidden">
        
        <div id="page-ranking" class="app-page hidden">
            <h2 style="margin-bottom:15px; font-size: 20px; color: var(--white);">🏆 Ranking Global</h2>
            <div class="filter-row">
                <select id="rank-stat" onchange="renderRanking()">
                    <option value="OVR">Estatística: OVR (Média)</option>
                    <option value="ATA">Ataque (ATA)</option>
                    <option value="LEV">Levantamento (LEV)</option>
                    <option value="BLO">Bloqueio (BLO)</option>
                    <option value="DEF">Defesa (DEF)</option>
                    <option value="PAS">Passe (PAS)</option>
                    <option value="SAQ">Saque (SAQ)</option>
                </select>
                <select id="rank-pos" onchange="renderRanking()">
                    <option value="Todos">Cargo: Todos</option>
                    <option value="Levantador">Levantador</option>
                    <option value="Oposto">Oposto</option>
                    <option value="Ponteiro">Ponteiro</option>
                    <option value="Central">Central</option>
                    <option value="Líbero">Líbero</option>
                </select>
            </div>
            <div id="ranking-list"></div>
        </div>

        <div id="page-search" class="app-page">
            <h2 style="margin-bottom:15px; font-size: 20px; color: var(--white);">🔍 Base de Jogadores</h2>
            <input type="text" id="search-input" placeholder="Buscar atleta por nome..." oninput="renderSearch()">
            <div class="filter-row">
                <select id="search-pos" onchange="renderSearch()">
                    <option value="">Posição (Todas)</option>
                    <option value="Levantador">Levantador</option>
                    <option value="Oposto">Oposto</option>
                    <option value="Ponteiro">Ponteiro</option>
                    <option value="Central">Central</option>
                    <option value="Líbero">Líbero</option>
                </select>
                <select id="search-city" onchange="renderSearch()">
                    <option value="">Cidade (Todas)</option>
                    <option value="Amargosa">Amargosa</option>
                    <option value="Salvador">Salvador</option>
                    <option value="Brasil">Outra</option>
                </select>
            </div>
            <div id="athlete-list"></div>
        </div>

        <div id="page-profile" class="app-page hidden">
            <button class="btn" id="btn-back" onclick="showPage('search')" style="margin-bottom:15px; display:none; background:var(--bg-panel); color:var(--text-light); border-color:var(--bg-card); width: auto;">← Voltar à Busca</button>
            
            <div class="player-card">
                <div class="card-header">
                    <div class="card-left">
                        <div class="overall-wrapper">
                            <div class="overall-val" id="card-ovr">00</div>
                        </div>
                        <div class="pos-badge" id="card-pos">POS</div>
                        <div class="badges-wrapper">
                            <img id="display-team-logo" class="img-slot" src="" onerror="this.style.display='none'">
                            <img id="display-city-flag" class="flag-slot" src="" onerror="this.style.display='none'">
                        </div>
                    </div>
                    
                    <div class="card-right">
                        <div class="profile-info">
                            <div class="profile-user">
                                <img id="card-photo" class="profile-pic" src="" onerror="this.src='https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png'">
                                <div>
                                    <h2 id="card-nick">NOME</h2>
                                    <p id="card-details">Cidade | Time</p>
                                </div>
                            </div>
                            <button id="btn-edit-trigger" onclick="toggleEditFields()" style="background:transparent; border:1px solid rgba(255,255,255,0.2); color:var(--text-light); border-radius:6px; padding:6px 10px; cursor:pointer; transition:0.3s;"><span style="font-size:16px;">⚙️</span></button>
                        </div>

                        <div id="edit-profile-area" class="hidden" style="margin-top:15px; background:var(--bg-main); padding:15px; border-radius:8px; border: 1px solid var(--bg-card);">
                            <label style="font-size:10px; color:var(--primary); font-weight:bold; text-transform:uppercase;">Link da Foto (URL)</label>
                            <input type="text" id="update-photo" placeholder="Cole o link da foto">
                            
                            <div style="display:flex; gap:10px;">
                                <div style="flex:1">
                                    <label style="font-size:10px; color:var(--primary); font-weight:bold; text-transform:uppercase;">Posição</label>
                                    <select id="update-pos">
                                        <option value="Levantador">Levantador</option>
                                        <option value="Oposto">Oposto</option>
                                        <option value="Ponteiro">Ponteiro</option>
                                        <option value="Central">Central</option>
                                        <option value="Líbero">Líbero</option>
                                    </select>
                                </div>
                                <div style="flex:1">
                                    <label style="font-size:10px; color:var(--primary); font-weight:bold; text-transform:uppercase;">Time</label>
                                    <select id="update-team">
                                        <option value="Livre">Livre</option>
                                        <option value="União Vôlei">União Vôlei</option>
                                        <option value="Vôlei Mar">Vôlei Mar</option>
                                    </select>
                                </div>
                            </div>
                            <label style="font-size:10px; color:var(--primary); font-weight:bold; text-transform:uppercase;">Cidade</label>
                            <select id="update-city">
                                <option value="Brasil">Brasil</option>
                                <option value="Amargosa">Amargosa</option>
                                <option value="Salvador">Salvador</option>
                            </select>
                            <button class="btn btn-solid" style="margin-top:10px; padding:10px; font-size:12px;" onclick="saveProfileUpdates()">Salvar Alterações</button>
                        </div>

                        <div style="height:150px; margin-top:10px; position: relative;"><canvas id="radarChart"></canvas></div>
                    </div>
                </div>
                
                <div id="card-stats-grid" class="stats-grid"></div>
                
                <div style="padding: 0 20px 20px 20px;">
                    <button class="btn btn-danger" id="btn-logout" onclick="logout()">Sair do Sistema</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="nav-bar" class="bottom-nav hidden">
    <div class="nav-item" id="nav-profile" onclick="showPage('profile')"><span class="nav-icon">👤</span> DASHBOARD</div>
    <div class="nav-item" id="nav-ranking" onclick="showPage('ranking')"><span class="nav-icon">🏆</span> RANKINGS</div>
    <div class="nav-item" id="nav-search" onclick="showPage('search')"><span class="nav-icon">🔍</span> BUSCA</div>
</div>

<script>
// --- CONFIGURAÇÃO SUPABASE ---
const SB_URL = 'https://bxjqvlmqhykzzgnypvsx.supabase.co'; 
const SB_KEY = 'sb_publishable_xTtFi8LsDmgHIxeez3OCdg_sIhEhG-y';
const _supabase = supabase.createClient(SB_URL, SB_KEY);
const GITHUB_BASE = "https://raw.githubusercontent.com/Xandenunes17/V-Stats-Site/main/vstats-assets";

const BIBLIOTECA_IMAGENS = {
    times: { "União Vôlei": `${GITHUB_BASE}/Logo-Uniao-Volei.png`, "Vôlei Mar": `${GITHUB_BASE}/Logo-Volei-Mar.png`, "Livre": `${GITHUB_BASE}/Logo-Livre.png` },
    cidades: { "Amargosa": `${GITHUB_BASE}/Amargosa-Bandeira.png`, "Salvador": `${GITHUB_BASE}/Salvador-Bandeira.png`, "Brasil": `${GITHUB_BASE}/Brasil-Bandeira.png` }
};

let currentUserData = null;
let viewedUserData = null;
let radarChart = null;
let isRegisterMode = false;

window.onload = () => {
    const savedUser = localStorage.getItem('vstats_user');
    if (savedUser) { currentUserData = JSON.parse(savedUser); enterApp(); }
};

function toggleAuthMode() { 
    isRegisterMode = !isRegisterMode; 
    document.getElementById('auth-title').innerText = isRegisterMode ? "Criar Nova Conta" : "Entrar no Sistema"; 
    document.getElementById('register-fields').classList.toggle('hidden', !isRegisterMode); 
}

function toggleEditFields() { 
    const editArea = document.getElementById('edit-profile-area');
    if(!editArea.classList.contains('hidden')) {
        editArea.classList.add('hidden');
        return;
    }
    document.getElementById('update-photo').value = currentUserData.photo || "";
    document.getElementById('update-pos').value = currentUserData.pos;
    document.getElementById('update-team').value = currentUserData.team;
    document.getElementById('update-city').value = currentUserData.city;
    editArea.classList.remove('hidden');
}

async function handleAuth() {
    const nick = document.getElementById('auth-nick').value.trim().toLowerCase();
    const pass = document.getElementById('auth-pass').value.trim();
    if(!nick || !pass) return alert("Preencha as credenciais.");

    if(isRegisterMode) {
        const { data, error } = await _supabase.from('atletas').insert([{ 
            nick, pass, email: document.getElementById('reg-email').value, 
            pos: document.getElementById('reg-pos-init').value, 
            city: "Brasil", team: "Livre", photo: "", stats: {ATA:60,LEV:60,BLO:60,DEF:60,PAS:60,SAQ:60}, ratings: {} 
        }]).select();
        
        if(error) return alert("Erro no sistema: " + error.message);
        currentUserData = data[0];
    } else {
        const { data } = await _supabase.from('atletas').select('*').eq('nick', nick).single();
        if(data && data.pass === pass) currentUserData = data;
        else return alert("Credenciais inválidas!");
    }
    localStorage.setItem('vstats_user', JSON.stringify(currentUserData));
    enterApp();
}

async function saveProfileUpdates() {
    const update = { 
        team: document.getElementById('update-team').value, 
        city: document.getElementById('update-city').value, 
        pos: document.getElementById('update-pos').value, 
        photo: document.getElementById('update-photo').value 
    };
    const { error } = await _supabase.from('atletas').update(update).eq('nick', currentUserData.nick);
    if(error) alert("Falha na sincronização!");
    else {
        currentUserData = {...currentUserData, ...update};
        localStorage.setItem('vstats_user', JSON.stringify(currentUserData));
        document.getElementById('edit-profile-area').classList.add('hidden');
        displayCard(currentUserData);
    }
}

async function rateStat(statKey, stars) {
    if(!viewedUserData || viewedUserData.nick === currentUserData.nick) return;
    const { data: current } = await _supabase.from('atletas').select('ratings').eq('nick', viewedUserData.nick).single();
    let ratings = current?.ratings || {};
    if(!ratings[statKey]) ratings[statKey] = { total: 0, count: 0 };
    ratings[statKey].total += (stars * 20);
    ratings[statKey].count += 1;
    await _supabase.from('atletas').update({ ratings }).eq('nick', viewedUserData.nick);
    const { data: updated } = await _supabase.from('atletas').select('*').eq('nick', viewedUserData.nick).single();
    displayCard(updated);
}

function displayCard(u) {
    if(!u) return;
    viewedUserData = u;
    const isOwner = (u.nick === currentUserData.nick);
    
    document.getElementById('card-nick').innerText = u.nick;
    document.getElementById('card-pos').innerText = u.pos;
    document.getElementById('card-details').innerText = `${u.city} | ${u.team}`;
    document.getElementById('card-photo').src = u.photo || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';
    
    document.getElementById('display-team-logo').src = BIBLIOTECA_IMAGENS.times[u.team] || '';
    document.getElementById('display-city-flag').src = BIBLIOTECA_IMAGENS.cidades[u.city] || '';
    document.getElementById('display-team-logo').style.display = BIBLIOTECA_IMAGENS.times[u.team] ? 'block' : 'none';
    document.getElementById('display-city-flag').style.display = BIBLIOTECA_IMAGENS.cidades[u.city] ? 'block' : 'none';
    
    document.getElementById('btn-edit-trigger').style.display = isOwner ? 'block' : 'none';

    const grid = document.getElementById('card-stats-grid'); grid.innerHTML = '';
    let sum = 0; const keys = ['ATA','LEV','BLO','DEF','PAS','SAQ']; const vals = [];
    
    keys.forEach(k => {
        let baseVal = (u.stats && u.stats[k]) ? u.stats[k] : 60;
        let avgStars = 0;
        if(u.ratings && u.ratings[k] && u.ratings[k].count > 0) {
            const avgPoints = u.ratings[k].total / u.ratings[k].count;
            avgStars = Math.round(avgPoints / 20);
            baseVal = Math.round((baseVal + avgPoints) / 2);
        }
        sum += baseVal; vals.push(baseVal);
        
        let starsHtml = isOwner ? '' : '<div class="stars-container">';
        if(!isOwner) {
            for(let i=1; i<=5; i++) starsHtml += `<span class="star-btn ${i <= avgStars ? 'active' : ''}" onclick="rateStat('${k}', ${i})">★</span>`;
            starsHtml += '</div>';
        }
        grid.innerHTML += `<div class="stat-box"><span class="stat-name">${k}</span><span class="stat-num">${baseVal}</span>${starsHtml}</div>`;
    });
    
    document.getElementById('card-ovr').innerText = Math.round(sum/6);
    setTimeout(() => initChart(vals), 50);
}

async function renderSearch() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const pos = document.getElementById('search-pos').value;
    const city = document.getElementById('search-city').value;

    let query = _supabase.from('atletas').select('*').ilike('nick', `%${q}%`);
    if(pos) query = query.eq('pos', pos);
    if(city) query = query.eq('city', city);

    const { data } = await query.limit(30);
    const list = document.getElementById('athlete-list'); list.innerHTML = '';
    
    data?.forEach(u => {
        let sum = 0; ['ATA','LEV','BLO','DEF','PAS','SAQ'].forEach(k => {
            let val = u.stats[k] || 60; if(u.ratings?.[k]) val = (val + (u.ratings[k].total/u.ratings[k].count))/2;
            sum += val;
        });
        const ovr = Math.round(sum/6);
        const avatar = u.photo || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png";
        
        list.innerHTML += `
        <div class="athlete-item" onclick="loadOther('${u.nick}')">
            <div class="athlete-info">
                <img src="${avatar}">
                <div><h4>${u.nick}</h4><p>${u.pos} | ${u.team}</p></div>
            </div>
            <div class="search-ovr"><small>OVR</small>${ovr}</div>
        </div>`;
    });
}

async function renderRanking() {
    const stat = document.getElementById('rank-stat').value;
    const pos = document.getElementById('rank-pos').value;
    
    let query = _supabase.from('atletas').select('*');
    if(pos !== 'Todos') query = query.eq('pos', pos);
    const { data } = await query;
    if(!data) return;

    const list = data.map(u => {
        let sum = 0; const s = {}; ['ATA','LEV','BLO','DEF','PAS','SAQ'].forEach(k => {
            let val = u.stats[k] || 60; if(u.ratings?.[k]) val = Math.round((val + (u.ratings[k].total/u.ratings[k].count))/2);
            s[k] = val; sum += val;
        });
        s.OVR = Math.round(sum/6); return {...u, s};
    }).sort((a,b) => b.s[stat] - a.s[stat]);

    const listEl = document.getElementById('ranking-list'); listEl.innerHTML = '';
    list.slice(0, 50).forEach((u, i) => {
        let badge = `<span style="font-size:16px; color:var(--text-light); width:25px; text-align:center;">${i+1}º</span>`;
        if(i===0) badge = `<span style="font-size:22px;">🥇</span>`;
        if(i===1) badge = `<span style="font-size:22px;">🥈</span>`;
        if(i===2) badge = `<span style="font-size:22px;">🥉</span>`;
        
        const avatar = u.photo || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png";
        const isOvr = stat === 'OVR';

        listEl.innerHTML += `
        <div class="athlete-item" onclick="loadOther('${u.nick}')">
            <div class="athlete-info">
                ${badge}
                <img src="${avatar}">
                <div><h4>${u.nick}</h4><p>${u.pos}</p></div>
            </div>
            <div class="search-ovr" style="${!isOvr ? 'background:transparent; border-color:var(--text-light); color:var(--white)' : ''}">
                <small style="${!isOvr ? 'color:var(--primary)' : ''}">${stat}</small>${u.s[stat]}
            </div>
        </div>`;
    });
}

function initChart(data) {
    const ctx = document.getElementById('radarChart').getContext('2d');
    if(radarChart) radarChart.destroy();
    radarChart = new Chart(ctx, {
        type: 'radar',
        data: { 
            labels: ['ATA','LEV','BLO','DEF','PAS','SAQ'], 
            datasets: [{ 
                data, 
                backgroundColor: 'rgba(34, 197, 94, 0.2)', 
                borderColor: '#22C55E', 
                borderWidth: 2, 
                pointBackgroundColor: '#22C55E',
                pointBorderColor: '#0F1115',
                pointRadius: 4,
                pointHoverRadius: 6
            }] 
        },
        options: { 
            responsive: true, maintainAspectRatio: false, 
            scales: { 
                r: { 
                    min: 0, max: 100, 
                    ticks: { display: false, stepSize: 20 }, 
                    grid: { color: 'rgba(255,255,255,0.05)' },
                    angleLines: { color: 'rgba(255,255,255,0.05)' },
                    pointLabels: { color: '#E5E7EB', font: { family: 'Orbitron', weight: 'bold', size: 10 } } 
                } 
            }, 
            plugins: { legend: { display: false } } 
        }
    });
}

async function loadOther(nick) { 
    const { data } = await _supabase.from('atletas').select('*').eq('nick', nick).single();
    if(data) { 
        showPage('profile'); displayCard(data); 
        document.getElementById('btn-back').style.display='block'; 
        document.getElementById('btn-logout').classList.add('hidden'); 
    } 
}

function showPage(p) {
    document.querySelectorAll('.app-page').forEach(el => el.classList.add('hidden'));
    document.getElementById('page-' + p).classList.remove('hidden');
    
    // Atualizar cor ativa no menu
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-' + p).classList.add('active');

    if(p === 'profile') { 
        displayCard(currentUserData); 
        document.getElementById('btn-back').style.display='none'; 
        document.getElementById('btn-logout').classList.remove('hidden'); 
    }
    else if(p === 'search') renderSearch(); 
    else if(p === 'ranking') renderRanking();
}

function enterApp() { 
    document.getElementById('auth-screen').classList.add('hidden'); 
    document.getElementById('main-app').classList.remove('hidden'); 
    document.getElementById('nav-bar').classList.remove('hidden'); 
    showPage('profile'); 
}

function logout() { localStorage.removeItem('vstats_user'); location.reload(); }
</script>
</body>
</html>
